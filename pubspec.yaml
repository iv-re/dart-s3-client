name: s3_client
description: An S3-compatible storage client.
version: 1.1.0
repository: https://github.com/iv-re/dart-s3-client

environment:
  sdk: ^3.13.0

dependencies:
  clock: ^1.1.2
  crypto: ^3.0.7
  ctx: ^1.0.0
  http: ^1.6.0
  meta: ^1.19.0
  sl: '>=1.0.0 <3.0.0'
  xml: ^7.0.1
  http_parser: ^4.1.2

dev_dependencies:
  mocktail: ^1.0.5
  pusk_lints: ^1.0.0
  test: ^1.31.2

false_secrets:
  - /example/s3_client_example.dart